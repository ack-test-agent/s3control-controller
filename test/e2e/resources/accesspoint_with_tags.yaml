apiVersion: s3control.services.k8s.aws/v1alpha1
kind: AccessPoint
metadata:
  name: $ACCESS_POINT_NAME
spec:
  name: $ACCESS_POINT_NAME
  bucket: $BUCKET_NAME
  accountID: "$ACCOUNT_ID"
  publicAccessBlockConfiguration:
    blockPublicACLs: true
  tags:
    - key: $TAG_KEY_1
      value: $TAG_VALUE_1
    - key: $TAG_KEY_2
      value: $TAG_VALUE_2
